name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Ci-Passw0rd-12345   # throwaway, CI only
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Ci-Passw0rd-12345 -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 20s
    env:
      # The integration tests create and drop their own database (BankPortal_IntegrationTests) on this server.
      BANKPORTAL_IT_CONNECTION: "Server=localhost,1433;User Id=sa;Password=Ci-Passw0rd-12345;TrustServerCertificate=True"
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Restore
        run: dotnet restore BankPortal.sln
      - name: Build
        run: dotnet build BankPortal.sln -c Release --no-restore
      - name: Unit tests
        run: dotnet test tests/BankPortal.Domain.Tests -c Release --no-build
      - name: Integration tests
        run: dotnet test tests/BankPortal.Api.IntegrationTests -c Release --no-build

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Type-check and build
        run: npm run build

  docker:
    name: Docker stack smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Create a throwaway .env
        run: |
          cat > .env <<EOF
          MSSQL_SA_PASSWORD=$(openssl rand -hex 12)-Aa1
          JWT_KEY=$(openssl rand -hex 32)
          ADMIN_EMAIL=admin@bankportal.local
          ADMIN_PASSWORD=$(openssl rand -hex 8)-Aa1x
          WEB_PORT=8080
          EOF
      - name: Build and start the stack
        run: docker compose up -d --build
      - name: Wait for the web container (it starts only after the API is healthy)
        run: |
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:8080/; then exit 0; fi
            sleep 5
          done
          echo "Stack did not become ready"; exit 1
      - name: Smoke test through nginx
        run: |
          set -euo pipefail
          set -a; . ./.env; set +a
          TOKEN=$(curl -fsS -X POST http://localhost:8080/api/auth/login \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"$ADMIN_EMAIL\",\"password\":\"$ADMIN_PASSWORD\"}" | jq -r .accessToken)
          test -n "$TOKEN" && test "$TOKEN" != "null"
          curl -fsS -H "Authorization: Bearer $TOKEN" http://localhost:8080/api/admin/ping
          curl -fsS -H "Authorization: Bearer $TOKEN" http://localhost:8080/api/admin/reports/deposits
      - name: Container logs (on failure)
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Tear down
        if: always()
        run: docker compose down -v