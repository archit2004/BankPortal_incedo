name: bankportal

x-db-connection: &db-connection "Server=sql,1433;Database=BankPortal;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"

services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
      MSSQL_MEMORY_LIMIT_MB: "2048"
    ports:
      - "127.0.0.1:14330:1433"      # optional: lets you inspect the stack's database from SSMS on localhost,14330
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # Runs once: applies EF migrations, then exits. The API only starts after it succeeds.
  migrator:
    build:
      context: .
      dockerfile: docker/migrator.Dockerfile
    depends_on:
      sql:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: *db-connection
      # The migrations bundle starts the API's configuration, which validates the JWT settings
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env}
      Jwt__Issuer: BankPortal
      Jwt__Audience: BankPortal.Web
    command: ["--connection", *db-connection]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    depends_on:
      sql:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: *db-connection
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env}
      Jwt__Issuer: BankPortal
      Jwt__Audience: BankPortal.Web
      Seed__OnStartup: "true"
      Seed__AdminEmail: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      Seed__AdminPassword: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      ForwardedHeaders__Enabled: "true"
      RateLimit__AuthPermitPerMinute: "10"
      Jobs__Enabled: "true"
      Jobs__RunAtIst: "01:00"
      Logging__Console__FormatterName: json
      Logging__Console__FormatterOptions__IncludeScopes: "true"
      Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command: Warning
    # No published port: only the web container (nginx) can reach the API.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  web:
    build:
      context: ./web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  sqldata: